name: build c/fastdfs

on:
  push:
    branches: [ "c/fastdfs" ]
  pull_request:
    branches: [ "c/fastdfs" ]
  workflow_dispatch:

jobs:
  build:
    # 老分支修复：脚本已从私有仓库 main 的 c/fastdfs/linux/ 归位到私有同名分支
    # c/fastdfs（内容与 c/fastdfs_v/linux/6_08 等价，构建 FastDFS V6.08）。
    # 改为按分支克隆，不再依赖 main 上的临时路径。
    runs-on: ubuntu-22.04

    steps:
    - name: Clone matching private source branch
      env:
        GH_TOKEN: ${{ secrets.COMPILER_PAT }}
      shell: bash
      run: |
        set -euo pipefail
        gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch 'c/fastdfs'

    - name: get_fastdfs
      working-directory: source
      shell: bash
      run: |
        set -euo pipefail
        chmod +x 'c/fastdfs/linux/get_fastdfs.sh'
        './c/fastdfs/linux/get_fastdfs.sh'
