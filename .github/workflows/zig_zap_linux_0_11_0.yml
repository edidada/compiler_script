name: build zig/zap/linux/0_11_0

on:
  push:
    branches:
      - 'zig/zap/linux/0_11_0'
  pull_request:
    branches:
      - 'zig/zap/linux/0_11_0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'zig/zap/linux/0_11_0/get_zap_0_11_0.sh'
          './zig/zap/linux/0_11_0/get_zap_0_11_0.sh'
