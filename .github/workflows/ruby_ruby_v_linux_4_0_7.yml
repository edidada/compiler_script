name: build ruby/ruby_v/linux/4_0_7

# ruby v4.0.7：ruby/ruby 最新稳定标签，从 git checkout 走 autogen.sh + out-of-source configure。
# 脚本在同名分支的源仓库里。
on:
  push:
    branches: ['ruby/ruby_v/linux/4_0_7']
  pull_request:
    branches: ['ruby/ruby_v/linux/4_0_7']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Clone matching source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"

      - name: Build ruby v4.0.7
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'ruby/ruby_v/linux/4_0_7/build_ruby.sh'
          './ruby/ruby_v/linux/4_0_7/build_ruby.sh'
