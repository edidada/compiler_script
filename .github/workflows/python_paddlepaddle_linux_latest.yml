name: build python/paddlepaddle/linux/latest
on:
  push:
    branches: ['python/paddlepaddle/linux/latest']
  pull_request:
    branches: ['python/paddlepaddle/linux/latest']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        run: gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Build PaddlePaddle CPU core from source
        working-directory: source
        shell: bash
        run: chmod +x python/paddlepaddle/linux/latest/build.sh && python/paddlepaddle/linux/latest/build.sh
