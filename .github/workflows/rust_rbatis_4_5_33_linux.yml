name: build rbatis 4.5.33

on:
  push:
    branches:
      - 'rust/rbatis/linux/4_5_33'
  pull_request:
    branches:
      - 'rust/rbatis/linux/4_5_33'
  workflow_dispatch:
  schedule:
    - cron: '0 0 28 * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile private-source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"

      - name: Execute source script
        shell: bash
        run: |
          set -euo pipefail
          test -f 'private-source/rust/rbatis/4_5_33/linux/get_rbatis_4_5_33_linux.sh'
          chmod +x 'private-source/rust/rbatis/4_5_33/linux/get_rbatis_4_5_33_linux.sh'
          'private-source/rust/rbatis/4_5_33/linux/get_rbatis_4_5_33_linux.sh'
