name: build c/nginx_v/linux/latest

# nginx（滚动 Stable）源码编译。脚本在同名分支的源仓库里：
#   c/nginx_v/linux/latest/build_nginx.sh   <- 现在用的是这个
#   c/nginx_v/linux/latest/get_nginx.sh     <- 旧脚本，nginx 1.8.1（2014），原样保留不动
# 旧 workflow 跑在 ubuntu-20.04 上：该标签在 GitHub 已下线，job 一直卡在 queued，
# 2026-09-18 的 35380490923 / 35377913628 也都是 cancelled，所以这里换 ubuntu-24.04。
# 1.8.1 在 Ubuntu 24.04 的 OpenSSL 3 环境下也编不过，因此走新的 build 脚本取当前 Stable。
on:
  push:
    branches: ['c/nginx_v/linux/latest']
  pull_request:
    branches: ['c/nginx_v/linux/latest']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone matching source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch 'c/nginx_v/linux/latest'

      - name: Build nginx (auto-detected Stable) from source
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash 'c/nginx_v/linux/latest/build_nginx.sh'
