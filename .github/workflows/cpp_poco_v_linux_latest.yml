name: build cpp/poco_v/linux/latest

on:
  push:
    branches:
      - 'cpp/poco_v/linux/latest'
  pull_request:
    branches:
      - 'cpp/poco_v/linux/latest'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'cpp/poco_v/linux/latest/get_poco_linux.sh'
          './cpp/poco_v/linux/latest/get_poco_linux.sh'
