name: build erlang/rabbitmq/linux/4_3_6

on:
  push:
    branches:
      - 'erlang/rabbitmq/linux/4_3_6'
  pull_request:
    branches:
      - 'erlang/rabbitmq/linux/4_3_6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'erlang/rabbitmq/linux/4_3_6/get_rabbitmq.sh'
          './erlang/rabbitmq/linux/4_3_6/get_rabbitmq.sh'
