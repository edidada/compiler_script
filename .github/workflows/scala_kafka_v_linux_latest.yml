name: build scala/kafka_v/linux/latest

on:
  push:
    branches:
      - 'scala/kafka_v/linux/latest'
  pull_request:
    branches:
      - 'scala/kafka_v/linux/latest'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # ubuntu-20.04 is retired from GitHub-hosted runners. Use the supported
    # current LTS image so a hosted runner can actually be assigned.
    runs-on: ubuntu-24.04
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch 'scala/kafka_v/linux/latest'
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'scala/kafka_v/linux/latest/get_kafka.sh'
          './scala/kafka_v/linux/latest/get_kafka.sh'
