name: build cpp/date/linux/3_0_1

on:
  push:
    branches:
      - 'cpp/date/linux/3_0_1'
  pull_request:
    branches:
      - 'cpp/date/linux/3_0_1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'cpp/date/linux/3_0_1/get_date3_0_1_linux.sh'
          './cpp/date/linux/3_0_1/get_date3_0_1_linux.sh'
