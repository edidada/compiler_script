name: build cpp/mmkv/android/latest
on:
  push:
    branches: ['cpp/mmkv/android/latest']
  pull_request:
    branches: ['cpp/mmkv/android/latest']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        run: gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        run: chmod +x cpp/mmkv/android/latest/build.sh && cpp/mmkv/android/latest/build.sh
