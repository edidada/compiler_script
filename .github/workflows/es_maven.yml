# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: build elasticsearch ubuntu-latest

on:
  push:
    branches: [ "java/elasticsearch" ]
  pull_request:
    branches: [ "java/elasticsearch" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: edidada/github_codespaces_compile
          ref: ${{ github.ref_name }}
          token: ${{ secrets.COMPILER_PAT }}
          clean: false
      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle
      - name: get_elasticsearch
        run:  |
          sudo apt update
          chmod +x ./java/elasticsearch/linux/get_elasticsearch.sh
          ./java/elasticsearch/linux/get_elasticsearch.sh