name: build Go 1.24.13

on:
  push:
    branches:
      - 'go/go/linux/1_24_13'
  pull_request:
    branches:
      - 'go/go/linux/1_24_13'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile private-source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"

      - name: Execute source script
        shell: bash
        run: |
          set -euo pipefail
          test -f 'private-source/go/go/1_24_13/linux/get_go_1_24_13_linux.sh'
          chmod +x 'private-source/go/go/1_24_13/linux/get_go_1_24_13_linux.sh'
          'private-source/go/go/1_24_13/linux/get_go_1_24_13_linux.sh'
