name: build go/runc_v/linux/1_5_2

# runc v1.5.2：opencontainers/runc 最新稳定标签，containerd 的默认 low-level runtime。
# 构建脚本放在 github_codespaces_compile 仓库的同名分支上。
on:
  push:
    branches: ['go/runc_v/linux/1_5_2']
  pull_request:
    branches: ['go/runc_v/linux/1_5_2']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Clone matching source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch 'go/runc_v/linux/1_5_2'

      - name: Build runc v1.5.2
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'go/runc_v/linux/1_5_2/build_runc.sh'
          './go/runc_v/linux/1_5_2/build_runc.sh'
