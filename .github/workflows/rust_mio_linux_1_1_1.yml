name: build mio 1.1.1

on:
  push:
    branches:
      - 'rust/mio/linux/1_1_1'
  pull_request:
    branches:
      - 'rust/mio/linux/1_1_1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile private-source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"

      - name: Execute source script
        shell: bash
        run: |
          set -euo pipefail
          test -f 'private-source/rust/mio/1_1_1/linux/get_mio_1_1_1_linux.sh'
          chmod +x 'private-source/rust/mio/1_1_1/linux/get_mio_1_1_1_linux.sh'
          'private-source/rust/mio/1_1_1/linux/get_mio_1_1_1_linux.sh'
