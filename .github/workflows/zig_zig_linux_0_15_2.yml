name: build zig/zig/linux/0_15_2

on:
  push:
    branches:
      - 'zig/zig/linux/0_15_2'
  pull_request:
    branches:
      - 'zig/zig/linux/0_15_2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'zig/zig/linux/0_15_2/get_zig_0_15_2.sh'
          './zig/zig/linux/0_15_2/get_zig_0_15_2.sh'
