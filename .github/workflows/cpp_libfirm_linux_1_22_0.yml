name: build cpp/libfirm/linux/1_22_0

on:
  push:
    branches:
      - 'cpp/libfirm/linux/1_22_0'
  pull_request:
    branches:
      - 'cpp/libfirm/linux/1_22_0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'cpp/libfirm/linux/1_22_0/get_libfirm.sh'
          './cpp/libfirm/linux/1_22_0/get_libfirm.sh'
