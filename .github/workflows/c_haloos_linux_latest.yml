name: build c/haloos/linux/latest

on:
  push:
    branches: ['c/haloos/linux/latest']
  pull_request:
    branches: ['c/haloos/linux/latest']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Build HaloOS VCOS rt_demo
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x c/haloos/linux/latest/build.sh
          c/haloos/linux/latest/build.sh
