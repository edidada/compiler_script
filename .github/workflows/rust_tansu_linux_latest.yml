name: build rust/tansu/linux/latest

on:
  push:
    branches:
      - 'rust/tansu/linux/latest'
  pull_request:
    branches:
      - 'rust/tansu/linux/latest'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch 'rust/tansu/linux/latest'
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'rust/tansu/linux/latest/build.sh'
          './rust/tansu/linux/latest/build.sh'
