name: build kotlin/kotlinx_coroutines/linux/latest

on:
  push:
    branches:
      - 'kotlin/kotlinx_coroutines/linux/latest'
  pull_request:
    branches:
      - 'kotlin/kotlinx_coroutines/linux/latest'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Build Kotlin coroutines
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x kotlin/kotlinx_coroutines/linux/latest/build.sh
          kotlin/kotlinx_coroutines/linux/latest/build.sh
