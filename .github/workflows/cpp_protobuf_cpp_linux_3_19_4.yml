name: build cpp/protobuf_cpp/linux/3_19_4

on:
  push:
    branches:
      - 'cpp/protobuf_cpp/linux/3_19_4'
  pull_request:
    branches:
      - 'cpp/protobuf_cpp/linux/3_19_4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'cpp/protobuf_cpp/linux/3_19_4/get_protobuf_cpp3_19_4.sh'
          './cpp/protobuf_cpp/linux/3_19_4/get_protobuf_cpp3_19_4.sh'
