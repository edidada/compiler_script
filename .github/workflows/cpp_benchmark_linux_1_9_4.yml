name: build cpp/benchmark/linux/1_9_4

on:
  push:
    branches:
      - 'cpp/benchmark/linux/1_9_4'
  pull_request:
    branches:
      - 'cpp/benchmark/linux/1_9_4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'cpp/benchmark/linux/1_9_4/get_benchmark_linux_1_9_4.sh'
          './cpp/benchmark/linux/1_9_4/get_benchmark_linux_1_9_4.sh'
