name: build cpp/octave/linux/11_1_0

on:
  push:
    branches:
      - 'cpp/octave/linux/11_1_0'
  pull_request:
    branches:
      - 'cpp/octave/linux/11_1_0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'cpp/octave/linux/11_1_0/get_octave_11_1_0.sh'
          './cpp/octave/linux/11_1_0/get_octave_11_1_0.sh'
