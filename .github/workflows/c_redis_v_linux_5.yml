name: build c/redis_v/linux/5

on:
  push:
    branches:
      - 'c/redis_v/linux/5'
  pull_request:
    branches:
      - 'c/redis_v/linux/5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch 'c/redis_v/linux/5'
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'c/redis_v/linux/5/get_redis_v5.sh'
          './c/redis_v/linux/5/get_redis_v5.sh'
