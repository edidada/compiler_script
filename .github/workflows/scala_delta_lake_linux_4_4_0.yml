name: build scala/delta_lake/linux/4_4_0

on:
  push:
    branches:
      - 'scala/delta_lake/linux/4_4_0'
  pull_request:
    branches:
      - 'scala/delta_lake/linux/4_4_0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'scala/delta_lake/linux/4_4_0/get_delta_lake.sh'
          './scala/delta_lake/linux/4_4_0/get_delta_lake.sh'
