name: build go/podman/linux/5_8_0

on:
  push:
    branches:
      - 'go/podman/linux/5_8_0'
  pull_request:
    branches:
      - 'go/podman/linux/5_8_0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'go/podman/linux/5_8_0/get_podman_linux_5_8_0.sh'
          './go/podman/linux/5_8_0/get_podman_linux_5_8_0.sh'
