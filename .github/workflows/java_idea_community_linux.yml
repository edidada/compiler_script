name: build IntelliJ IDEA Community latest

on:
  push:
    branches:
      - 'java/idea_community_v/linux/latest'
  pull_request:
    branches:
      - 'java/idea_community_v/linux/latest'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone matching private source branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile private-source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"

      - name: Execute source script
        shell: bash
        run: |
          set -euo pipefail
          test -f 'private-source/java/idea_community/linux/java_idea_community_linux.sh'
          chmod +x 'private-source/java/idea_community/linux/java_idea_community_linux.sh'
          'private-source/java/idea_community/linux/java_idea_community_linux.sh'
