name: build cpp/tbb/linux/2022_2_0

on:
  push:
    branches:
      - 'cpp/tbb/linux/2022_2_0'
  pull_request:
    branches:
      - 'cpp/tbb/linux/2022_2_0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'cpp/tbb/linux/2022_2_0/get_tbb2022_2_0_linux.sh'
          './cpp/tbb/linux/2022_2_0/get_tbb2022_2_0_linux.sh'
