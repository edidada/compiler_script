name: build go/k3s_v/linux/1_37_1_k3s1

# k3s v1.37.1+k3s1：k3s-io/k3s 最新稳定标签。上游 make binary 需要 docker buildx，
# 托管 runner 用不了，脚本改成按 Dockerfile 的 stage 顺序直接跑 scripts/{download,build,package-cli}。
# 脚本在同名分支的源仓库里。
on:
  push:
    branches: ['go/k3s_v/linux/1_37_1_k3s1']
  pull_request:
    branches: ['go/k3s_v/linux/1_37_1_k3s1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Clone matching source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"

      - name: Build k3s v1.37.1+k3s1
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'go/k3s_v/linux/1_37_1_k3s1/build_k3s.sh'
          './go/k3s_v/linux/1_37_1_k3s1/build_k3s.sh'
