name: build cpp/pybind11/linux/2_13_6

on:
  push:
    branches:
      - 'cpp/pybind11/linux/2_13_6'
  pull_request:
    branches:
      - 'cpp/pybind11/linux/2_13_6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'cpp/pybind11/linux/2_13_6/get_pybind11_linux_2_13_6.sh'
          './cpp/pybind11/linux/2_13_6/get_pybind11_linux_2_13_6.sh'
