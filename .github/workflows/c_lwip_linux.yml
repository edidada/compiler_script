name: build lwIP 2.2.0

on:
  push:
    branches:
      - 'c/lwip_v/linux/2_2_0'
  pull_request:
    branches:
      - 'c/lwip_v/linux/2_2_0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone matching private source branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile private-source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"

      - name: Execute source script
        shell: bash
        run: |
          set -euo pipefail
          test -f 'private-source/c/lwip/linux/get_lwip.sh'
          chmod +x 'private-source/c/lwip/linux/get_lwip.sh'
          'private-source/c/lwip/linux/get_lwip.sh'
