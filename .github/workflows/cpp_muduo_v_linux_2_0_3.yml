name: build cpp/muduo_v/linux/2_0_3

on:
  push:
    branches:
      - 'cpp/muduo_v/linux/2_0_3'
  pull_request:
    branches:
      - 'cpp/muduo_v/linux/2_0_3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'cpp/muduo_v/linux/2_0_3/get_muduo2_0_3.sh'
          './cpp/muduo_v/linux/2_0_3/get_muduo2_0_3.sh'
