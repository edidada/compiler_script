name: build go/containerd_v/linux/2_2_3_k3s1

# containerd v2.2.3-k3s1：K3s 团队基于上游 containerd v2.2.3 打补丁维护的定制版本，
# 源码与构建脚本放在 github_codespaces_compile 仓库的同名分支上。
on:
  push:
    branches: ['go/containerd_v/linux/2_2_3_k3s1']
  pull_request:
    branches: ['go/containerd_v/linux/2_2_3_k3s1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Clone matching source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch 'go/containerd_v/linux/2_2_3_k3s1'

      - name: Build containerd v2.2.3-k3s1
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'go/containerd_v/linux/2_2_3_k3s1/build_containerd.sh'
          './go/containerd_v/linux/2_2_3_k3s1/build_containerd.sh'
