name: build shell/linux_from_scratch/linux/latest

on:
  push:
    branches: ['shell/linux_from_scratch/linux/latest']
  pull_request:
    branches: ['shell/linux_from_scratch/linux/latest']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch 'shell/linux_from_scratch/linux/latest'
      - name: Build and validate the official LFS book
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x shell/linux_from_scratch/linux/latest/build.sh
          shell/linux_from_scratch/linux/latest/build.sh
