name: build cpp/ros2/linux/jazzy

on:
  push:
    branches: ['cpp/ros2/linux/jazzy']
  pull_request:
    branches: ['cpp/ros2/linux/jazzy']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Build ROS 2 Jazzy rclcpp core
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x cpp/ros2/linux/jazzy/build.sh
          cpp/ros2/linux/jazzy/build.sh
