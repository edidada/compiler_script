name: build java/nacos_v/linux/2_4_3

on:
  push:
    branches:
      - 'java/nacos_v/linux/2_4_3'
  pull_request:
    branches:
      - 'java/nacos_v/linux/2_4_3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'java/nacos_v/linux/2_4_3/get_nacos2_4_3.sh'
          './java/nacos_v/linux/2_4_3/get_nacos2_4_3.sh'
