name: build go/go/linux/1_24_13

on:
  push:
    branches:
      - 'go/go/linux/1_24_13'
  pull_request:
    branches:
      - 'go/go/linux/1_24_13'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'go/go/linux/1_24_13/get_go_1_24_13_linux.sh'
          './go/go/linux/1_24_13/get_go_1_24_13_linux.sh'
