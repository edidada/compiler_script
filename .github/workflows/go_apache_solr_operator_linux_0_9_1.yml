name: build go/apache_solr_operator/linux/0_9_1

on:
  push:
    branches:
      - 'go/apache_solr_operator/linux/0_9_1'
  pull_request:
    branches:
      - 'go/apache_solr_operator/linux/0_9_1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Set up required Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: false
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'go/apache_solr_operator/linux/0_9_1/build.sh' 'tools/foundations/build_project.sh'
          './go/apache_solr_operator/linux/0_9_1/build.sh'
