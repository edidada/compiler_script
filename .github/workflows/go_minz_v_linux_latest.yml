name: build go/minz_v/linux/latest

on:
  push:
    branches:
      - 'go/minz_v/linux/latest'
  pull_request:
    branches:
      - 'go/minz_v/linux/latest'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # MinZ（oisee/minz）：纯 Go 的 Z80 现代语言编译器工具链（mz/mza/mze）。
    # 端到端：go build 出编译器/汇编器/模拟器 → mz 把 Nanz 示例编成 Z80 汇编 → mza 汇编成 CP/M .com
    # → mze 模拟器运行，输出 "Hello!"。纯 Go 全平台，6 腿原生编译。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-26.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          git config --global core.autocrlf false
          git config --global core.longpaths true
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch 'go/minz_v/linux/latest'
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x 'go/minz_v/linux/latest/get_minz.sh'
          './go/minz_v/linux/latest/get_minz.sh'
      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: minz-${{ matrix.os }}-${{ matrix.arch }}
          path: source/_minz_build/artifacts/*
          if-no-files-found: error
          retention-days: 14
