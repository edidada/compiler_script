name: build javascript/apache_incubator_pouchdb/linux/latest

on:
  push:
    branches:
      - 'javascript/apache_incubator_pouchdb/linux/latest'
  pull_request:
    branches:
      - 'javascript/apache_incubator_pouchdb/linux/latest'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Set up compatible Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'javascript/apache_incubator_pouchdb/linux/latest/build.sh' 'tools/foundations/build_project.sh'
          './javascript/apache_incubator_pouchdb/linux/latest/build.sh'
