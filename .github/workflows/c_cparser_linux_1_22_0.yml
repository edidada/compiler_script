name: build c/cparser/linux/1_22_0

on:
  push:
    branches:
      - 'c/cparser/linux/1_22_0'
  pull_request:
    branches:
      - 'c/cparser/linux/1_22_0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch 'c/cparser/linux/1_22_0'
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x 'c/cparser/linux/1_22_0/get_cparser.sh'
          './c/cparser/linux/1_22_0/get_cparser.sh'
