name: build flex 2.6.5

on:
  push:
    branches:
      - 'c/flex/linux/2_6_5'
  pull_request:
    branches:
      - 'c/flex/linux/2_6_5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone matching private source branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile private-source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"

      - name: Execute source script
        shell: bash
        run: |
          set -euo pipefail
          test -f 'private-source/c/flex/linux/2_6_5/get_flex_2_6_5.sh'
          chmod +x 'private-source/c/flex/linux/2_6_5/get_flex_2_6_5.sh'
          'private-source/c/flex/linux/2_6_5/get_flex_2_6_5.sh'
