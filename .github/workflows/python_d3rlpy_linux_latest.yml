name: build python/d3rlpy/linux/latest
on:
  push:
    branches: ['python/d3rlpy/linux/latest']
  pull_request:
    branches: ['python/d3rlpy/linux/latest']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        run: gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"
      - name: Build d3rlpy
        working-directory: source
        shell: bash
        run: chmod +x python/d3rlpy/linux/latest/build.sh && python/d3rlpy/linux/latest/build.sh
