name: build wgpu 25.0.0

on:
  push:
    branches:
      - 'rust/wgpu/linux/25_0_0'
  pull_request:
    branches:
      - 'rust/wgpu/linux/25_0_0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone matching private source branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile private-source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"

      - name: Execute source script
        shell: bash
        run: |
          set -euo pipefail
          test -f 'private-source/rust/wgpu/linux/25_0_0/get_wgpu_25_0_0.sh'
          chmod +x 'private-source/rust/wgpu/linux/25_0_0/get_wgpu_25_0_0.sh'
          'private-source/rust/wgpu/linux/25_0_0/get_wgpu_25_0_0.sh'
