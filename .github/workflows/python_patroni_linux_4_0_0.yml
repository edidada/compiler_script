name: build Patroni 4.0.0

on:
  push:
    branches:
      - 'python/patroni/linux/4_0_0'
  pull_request:
    branches:
      - 'python/patroni/linux/4_0_0'
  workflow_dispatch:
  schedule:
    - cron: '0 0 28 * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone matching private source branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        run: |
          set -euo pipefail
          gh repo clone sandisks/github_codespaces_compile private-source -- --depth=1 --single-branch --branch "$GITHUB_REF_NAME"

      - name: Execute source script
        shell: bash
        run: |
          set -euo pipefail
          test -f 'private-source/python/patroni/4_0_0/linux/get_patroni_4_0_0.sh'
          chmod +x 'private-source/python/patroni/4_0_0/linux/get_patroni_4_0_0.sh'
          'private-source/python/patroni/4_0_0/linux/get_patroni_4_0_0.sh'
