name: build java/questdb_v/linux/latest

on:
  push:
    branches:
      - 'java/questdb_v/linux/latest'
  pull_request:
    branches:
      - 'java/questdb_v/linux/latest'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # QuestDB（questdb/questdb）源码编译，构建入口是 mvn package -DskipTests（仓库根 pom.xml，无 mvnw）。
    # 上游 master 固定 javac.target=25，且 java.enforce.version 只在 jdk(24,) 激活的
    # java25+ profile 里定义——JDK <25 时 enforcer 拿到空版本直接失败，所以必须 JDK 25。
    # 首次构建要拉下一堆 maven 依赖，超时放宽到 90 分钟。
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Set up JDK 25（上游 master 必须：javac.target=25 + enforcer java25+ profile）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Clone matching private source branch
        env:
          GH_TOKEN: ${{ secrets.COMPILER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          gh repo clone "$GITHUB_REPOSITORY_OWNER/github_codespaces_compile" source -- --depth=1 --single-branch --branch 'java/questdb_v/linux/latest'
      - name: Execute source script
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x -- 'java/questdb_v/linux/latest/get_questdb.sh'
          './java/questdb_v/linux/latest/get_questdb.sh'
      - name: Upload built packages
        uses: actions/upload-artifact@v4
        with:
          name: questdb-ubuntu-22.04
          path: source/_questdb_build/artifacts/*
          if-no-files-found: error
          retention-days: 14
